<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LQVE JP Clone</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* 1. 기본 스타일: 원본처럼 극도의 미니멀리즘 */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body {
            background-color: #fff; /* 순백색 배경 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            color: #000;
        }

        /* 2. 상단 고정 헤더 */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 30px 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8); /* 살짝 투명 */
            backdrop-filter: blur(5px);
        }

        .logo {
            font-size: 20px; font-weight: 700; letter-spacing: 5px;
        }

        nav span {
            font-size: 12px; letter-spacing: 2px; margin-left: 20px; cursor: pointer;
        }

        /* 3. 메인 콘텐츠: 이미지들이 길게 나열되는 구조 */
        main {
            padding-top: 150px; /* 헤더 공간 확보 */
            display: flex; flex-direction: column; align-items: center;
            gap: 100px; /* 이미지 사이 간격 */
            padding-bottom: 200px;
        }

        .img-box {
            width: 90%; max-width: 1000px;
            opacity: 0; /* 처음에 안 보임 */
            transform: translateY(100px); /* 아래에 배치 */
        }

        .img-box img {
            width: 100%; height: auto; display: block;
            filter: grayscale(20%); /* 원본 특유의 차분한 색감 */
            transition: filter 0.5s;
        }

        .img-box:hover img {
            filter: grayscale(0%); /* 마우스 올리면 컬러로 */
        }

        .img-info {
            margin-top: 15px;
            font-size: 11px; letter-spacing: 1px; color: #666;
            text-align: left;
        }

        /* 4. 푸터 */
        footer {
            padding: 100px 0; text-align: center;
            font-size: 10px; color: #ccc; letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">LQVE</div>
        <nav>
            <span>COLLECTION</span>
            <span>INFO</span>
        </nav>
    </header>

    <main id="main-content">
        <div class="img-box reveal">
            <img src="https://picsum.photos/1200/1600?random=1" alt="Work 01">
            <div class="img-info">PROJECT 01 / TOKYO</div>
        </div>

        <div class="img-box reveal">
            <img src="https://picsum.photos/1200/1600?random=2" alt="Work 02">
            <div class="img-info">PROJECT 02 / OSAKA</div>
        </div>

        <div class="img-box reveal">
            <img src="https://picsum.photos/1200/1600?random=3" alt="Work 03">
            <div class="img-info">PROJECT 03 / SEOUL</div>
        </div>

        <div class="img-box reveal">
            <img src="https://picsum.photos/1200/1600?random=4" alt="Work 04">
            <div class="img-info">PROJECT 04 / KYOTO</div>
        </div>

        <div class="img-box reveal">
            <img src="https://picsum.photos/1200/1600?random=5" alt="Work 05">
            <div class="img-info">PROJECT 05 / PARIS</div>
        </div>
        
        </main>

    <footer>
        <p>&copy; 2026 LQVE CLONE. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        // 1. 스크롤 애니메이션 설정 (GSAP ScrollTrigger)
        gsap.registerPlugin(ScrollTrigger);

        // 모든 .reveal 클래스를 가진 박스들에 대해 애니메이션 적용
        gsap.utils.toArray(".reveal").forEach((item) => {
            gsap.to(item, {
                scrollTrigger: {
                    trigger: item,
                    start: "top 85%", // 화면 하단에서 15% 정도 올라왔을 때 시작
                    toggleActions: "play none none reverse", // 내릴 때 재생, 올릴 때 반대로
                    // once: true // 한 번만 나타나게 하려면 이 주석을 해제하세요
                },
                opacity: 1,
                y: 0, // 원래 위치(0)로 이동
                duration: 1.5,
                ease: "power2.out"
            });
        });

        // 2. 부드러운 스크롤 느낌 (선택 사항: 원본의 묵직한 스크롤 느낌 재현)
        // 실제 원본 사이트는 브라우저 기본 스크롤을 사용하지만, 
        // 이미지가 올라오는 속도를 위 gsap duration(1.5)으로 조절하여 똑같은 느낌을 냈습니다.
    </script>
</body>
</html>
