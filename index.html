<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S5-Style Clone</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* 1. 기본 스타일 및 배경 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* 기본 마우스 포인터를 숨깁니다 (커스텀 포인터 사용) */
        }

        body {
            background-color: #000; /* S5-Style 특유의 깊은 검정 */
            color: #fff;
            font-family: 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 2. 커스텀 마우스 포인터 (따라다니는 원) */
        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none; /* 마우스 클릭 방해 금지 */
            z-index: 9999;
            mix-blend-mode: difference; /* 글자 위에 올라가면 색상 반전 효과 */
            transition: transform 0.1s ease-out;
        }

        /* 3. 헤더 레이아웃 */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 700;
            letter-spacing: -2px;
            opacity: 0; /* 초기 상태 투명 */
            transform: translateY(50px); /* 아래에서 위로 올라오는 효과 준비 */
        }

        /* 4. 그리드 콘텐츠 레이아웃 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: #111;
            aspect-ratio: 16 / 9;
            opacity: 0; /* 스크롤 전 투명 */
            transform: translateY(30px);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .card:hover img {
            transform: scale(1.1); /* 마우스 올리면 이미지 확대 */
        }

        /* 5. 텍스트 페이드인 섹션 */
        .text-section {
            padding: 200px 20px;
            text-align: center;
        }

        .fade-text {
            font-size: 2rem;
            margin-bottom: 20px;
            opacity: 0;
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .main-title { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <header>
        <h1 class="main-title">S5 STYLE<br>CREATIVE</h1>
    </header>

    <main class="container">
        <div class="grid">
            <div class="card reveal">
                <img src="https://picsum.photos/1200/800?random=1" alt="Work 01">
            </div>
            <div class="card reveal">
                <img src="https://picsum.photos/1200/800?random=2" alt="Work 02">
            </div>
            <div class="card reveal">
                <img src="https://picsum.photos/1200/800?random=3" alt="Work 03">
            </div>
            <div class="card reveal">
                <img src="https://picsum.photos/1200/800?random=4" alt="Work 04">
            </div>
        </div>
    </main>

    <section class="text-section">
        <p class="fade-text">We Design Experience.</p>
        <p class="fade-text">Innovation through Simplicity.</p>
    </section>

    <script>
        // 1. 마우스 포인터 움직임 로직
        const cursor = document.querySelector('#cursor');
        document.addEventListener('mousemove', (e) => {
            // 마우스 위치에 따라 원이 따라다님
            gsap.to(cursor, {
                x: e.clientX - 10,
                y: e.clientY - 10,
                duration: 0.1
            });
        });

        // 마우스 클릭 시 커서가 커지는 효과
        document.addEventListener('mousedown', () => gsap.to(cursor, { scale: 1.5 }));
        document.addEventListener('mouseup', () => gsap.to(cursor, { scale: 1 }));

        // 2. 페이지 로드 시 첫 타이틀 페이드인 (애니메이션)
        window.addEventListener('load', () => {
            gsap.to(".main-title", {
                opacity: 1,
                y: 0,
                duration: 1.5,
                ease: "power4.out"
            });
        });

        // 3. 스크롤 시 요소들이 나타나는 페이드인 (ScrollTrigger)
        gsap.registerPlugin(ScrollTrigger);

        // 카드들이 스크롤될 때 하나씩 나타남
        gsap.utils.toArray(".reveal").forEach((card) => {
            gsap.to(card, {
                scrollTrigger: {
                    trigger: card,
                    start: "top 85%", // 화면의 85% 지점에 도달하면 시작
                    toggleActions: "play none none reverse"
                },
                opacity: 1,
                y: 0,
                duration: 1,
                ease: "power2.out"
            });
        });

        // 텍스트 페이드인
        gsap.utils.toArray(".fade-text").forEach((text) => {
            gsap.to(text, {
                scrollTrigger: {
                    trigger: text,
                    start: "top 90%"
                },
                opacity: 1,
                duration: 2,
                ease: "expo.out"
            });
        });
    </script>
</body>
</html>
