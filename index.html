<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LQVE Style Clone</title>
    
    <style>
        /* 1. 기본 초기화 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff; /* 배경 흰색 */
            font-family: "Helvetica", "Arial", sans-serif;
            color: #000000;
            line-height: 1.5;
        }

        /* 2. 상단 메뉴 설정 */
        header {
            width: 100%;
            padding: 60px 40px;
            display: flex;
            flex-direction: column; /* 로고와 메뉴를 세로로 배치 */
            align-items: center;    /* 중앙 정렬 */
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 8px; /* 글자 간격 넓게 */
            margin-bottom: 30px;
            cursor: pointer;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px; /* 메뉴 사이 간격 */
        }

        nav ul li a {
            text-decoration: none;
            color: #777; /* 메뉴 글자 약간 흐리게 */
            font-size: 12px;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #000; /* 마우스 올리면 검은색 */
        }

        /* 3. 이미지 그리드 설정 (메인 화면) */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            /* 화면 너비에 따라 자동으로 1열, 2열, 3열로 변함 */
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .item {
            margin-bottom: 60px;
            cursor: pointer;
        }

        .item img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.4s;
        }

        .item img:hover {
            opacity: 0.8; /* 마우스 올리면 살짝 투명하게 */
        }

        .item-info {
            margin-top: 15px;
            text-align: left;
        }

        .item-info h3 {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* 4. 하단 영역 */
        footer {
            padding: 100px 0 50px;
            text-align: center;
            font-size: 10px;
            color: #ccc;
            letter-spacing: 1px;
        }

        /* 모바일 대응: 화면이 작아지면 여백 조절 */
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr; /* 무조건 한 줄 */
            }
            .logo { font-size: 24px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">LQVE</div>
        <nav>
            <ul>
                <li><a href="#">COLLECTION</a></li>
                <li><a href="#">ARCHIVE</a></li>
                <li><a href="#">INFO</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="item">
            <img src="https://picsum.photos/800/1000?random=1" alt="Work 01">
            <div class="item-info">
                <h3>PROJECT 2026-A</h3>
            </div>
        </div>

        <div class="item">
            <img src="https://picsum.photos/800/1000?random=2" alt="Work 02">
            <div class="item-info">
                <h3>PROJECT 2026-B</h3>
            </div>
        </div>

        <div class="item">
            <img src="https://picsum.photos/800/1000?random=3" alt="Work 03">
            <div class="item-info">
                <h3>PROJECT 2026-C</h3>
            </div>
        </div>

        <div class="item">
            <img src="https://picsum.photos/800/1000?random=4" alt="Work 04">
            <div class="item-info">
                <h3>PROJECT 2026-D</h3>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 LQVE CLONE. ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>
