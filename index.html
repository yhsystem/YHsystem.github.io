<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Hotaeys의 홈페이지</title>
    <style>
        /* 화면 전체의 기본 설정을 합니다. */
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            text-align: center; 
            padding: 50px; 
            background-color: #f0f0f0; /* 배경색: 밝은 회색 */
        }
        /* 메인 컨텐츠 박스 스타일입니다. */
        .main-box { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            display: inline-block; 
        }
        h1 { color: #2c3e50; } /* 제목 색상: 짙은 남색 계열 */
        p { color: #555; font-size: 1.2rem; } /* 본문 글자 크기와 색상 */
    </style>
</head>
<body>

    <div class="main-box">
        <h1>Hotaeys의 홈페이지에 오신 걸 환영합니다!</h1>
        <hr> <p>이곳은 제가 직접 만든 첫 번째 무료 홈페이지입니다.</p>
        <p>앞으로 멋진 내용들로 채워나갈 예정입니다.</p>
    </div>

</body>
</html>
