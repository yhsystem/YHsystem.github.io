<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LQVE — Perfect Clone</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* 2. CSS 스타일링 (전체 레이아웃 및 여백 최적화) */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --sub-text: #888888;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-font-smoothing: antialiased; /* 폰트를 부드럽게 출력 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
            line-height: 1;
        }

        /* [핵심] 상단 고정 헤더 */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 40px 50px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }

        .logo {
            font-size: 20px; font-weight: 700; letter-spacing: 0.3em;
            text-decoration: none; color: inherit;
        }

        .nav-links {
            display: flex; gap: 40px;
            font-size: 11px; font-weight: 400; letter-spacing: 0.15em;
        }

        /* [핵심] 이미지 리스트 레이아웃 (LQVE 특유의 비대칭 배치) */
        main {
            padding: 250px 0 150px; /* 상단 여백 크게 */
        }

        .item-wrapper {
            width: 100%;
            padding: 0 5%;
            margin-bottom: 25vw; /* 이미지 사이의 거대한 수직 여백 */
            display: flex;
            flex-direction: column;
        }

        /* 홀수/짝수 이미지를 왼쪽/오른쪽으로 어긋나게 배치 */
        .item-wrapper:nth-child(even) { align-items: flex-end; }
        .item-wrapper:nth-child(odd) { align-items: flex-start; }

        .item {
            width: 55%; /* 이미지 너비 제한 */
            position: relative;
            overflow: hidden; /* 패럴랙스 효과를 위해 필요 */
            opacity: 0;
            transform: translateY(100px); /* 아래에서 대기 */
        }

        .img-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .item img {
            width: 100%;
            height: 120%; /* 패럴랙스 여유분을 위해 높이를 1.2배로 설정 */
            object-fit: cover;
            object-position: center;
            transform: translateY(-10%); /* 초기 위치 조정 */
            filter: grayscale(10%);
            transition: filter 0.6s ease;
        }

        .item:hover img {
            filter: grayscale(0%);
        }

        /* 캡션: 이미지 왼쪽 하단 텍스트 */
        .caption {
            margin-top: 20px;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--sub-text);
            text-transform: uppercase;
        }

        /* 하단 푸터 */
        footer {
            padding: 100px 50px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 9px;
            letter-spacing: 0.2em;
            color: #ccc;
        }

        /* 3. 로딩 애니메이션 (진입 시 부드러운 노출) */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 2000;
            display: flex; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <div id="loader"></div>

    <header>
        <a href="#" class="logo">LQVE</a>
        <div class="nav-links">
            <span>INDEX</span>
            <span>INFO</span>
        </div>
    </header>

    <main id="main-content">
        <div class="item-wrapper">
            <div class="item reveal-item">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1515542706656-8e6ef17a1521?auto=format&fit=crop&w=1200&q=80" alt="Work 01" class="parallax-img">
                </div>
                <div class="caption">Project 01 / TOKYO</div>
            </div>
        </div>

        <div class="item-wrapper">
            <div class="item reveal-item">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1542038784456-1ea8e935640e?auto=format&fit=crop&w=1200&q=80" alt="Work 02" class="parallax-img">
                </div>
                <div class="caption">Project 02 / PARIS</div>
            </div>
        </div>

        <div class="item-wrapper">
            <div class="item reveal-item">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=1200&q=80" alt="Work 03" class="parallax-img">
                </div>
                <div class="caption">Project 03 / LONDON</div>
            </div>
        </div>

        <div class="item-wrapper">
            <div class="item reveal-item">
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1493397212122-2b85edf59fd6?auto=format&fit=crop&w=1200&q=80" alt="Work 04" class="parallax-img">
                </div>
                <div class="caption">Project 04 / SEOUL</div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 LQVE. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        // 4. 자바스크립트 인터랙션 (전체 애니메이션 엔진)
        gsap.registerPlugin(ScrollTrigger);

        // [로딩] 페이지 로드 시 부드러운 등장
        window.addEventListener('load', () => {
            gsap.to("#loader", {
                opacity: 0,
                duration: 1.2,
                ease: "power2.inOut",
                onComplete: () => document.getElementById("loader").remove()
            });
        });

        // [핵심 1] 스크롤 시 이미지가 슥 올라오는 'Reveal' 효과
        const items = document.querySelectorAll(".reveal-item");
        items.forEach((item) => {
            gsap.to(item, {
                scrollTrigger: {
                    trigger: item,
                    start: "top 95%", // 화면 끝에 닿으면 시작
                    end: "bottom 20%",
                    toggleActions: "play none none reverse"
                },
                opacity: 1,
                y: 0,
                duration: 2, // 원본의 아주 느리고 우아한 속도
                ease: "power3.out"
            });
        });

        // [핵심 2] 이미지 내부 패럴랙스 효과 (스크롤 속도에 따라 이미지가 안에서 움직임)
        const parallaxImgs = document.querySelectorAll(".parallax-img");
        parallaxImgs.forEach((img) => {
            gsap.to(img, {
                scrollTrigger: {
                    trigger: img.parentElement,
                    scrub: 1.5, // 끈적하게 따라오는 관성 효과
                },
                y: "15%", // 스크롤할 때 이미지 위치를 15%만큼 아래로 이동
                ease: "none"
            });
        });
    </script>
</body>
</html>
