<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typesetting Studio Clone</title>
    
    <style>
        /* 1. 기본 스타일 설정: 여백을 없애고 폰트를 설정합니다. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000; /* 배경은 짙은 검정색 */
            color: #fff;           /* 글자는 흰색 */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            word-break: keep-all;  /* 한글 줄바꿈 최적화 */
            overflow-x: hidden;    /* 가로 스크롤 방지 */
        }

        /* 2. 상단 네비게이션: 양 끝으로 배치합니다. */
        header {
            width: 100%;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: fixed; /* 상단에 고정 */
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: -0.05em;
        }

        nav ul {
            list-style: none;
            text-align: right;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 5px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        nav ul li a:hover {
            opacity: 1; /* 마우스 올리면 선명하게 */
        }

        /* 3. 메인 히어로 섹션: 거대한 텍스트가 특징입니다. */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
        }

        .hero h1 {
            font-size: clamp(3rem, 15vw, 12rem); /* 화면 크기에 따라 폰트 크기 자동 조절 */
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -0.04em;
            text-transform: uppercase;
        }

        /* 4. 이미지 그리드 섹션: 2열 배치를 기본으로 합니다. */
        .work-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2개 열로 나눔 */
            gap: 20px;
            padding: 20px;
        }

        .work-item {
            position: relative;
            background-color: #1a1a1a; /* 이미지 로딩 전 배경색 */
            aspect-ratio: 4 / 5;      /* 이미지 비율 고정 */
            overflow: hidden;
        }

        .work-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 이미지가 꽉 차도록 설정 */
            filter: grayscale(100%); /* 흑백 효과 */
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s;
        }

        .work-item:hover img {
            transform: scale(1.05); /* 마우스 올리면 약간 확대 */
            filter: grayscale(0%);  /* 마우스 올리면 컬러로 변경 (선택 사항) */
        }

        .work-info {
            padding: 20px 40px 80px;
        }

        .work-info h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* 5. 푸터 영역 */
        footer {
            padding: 100px 40px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        /* 모바일 대응: 화면이 좁아지면 1열로 변경 */
        @media (max-width: 768px) {
            header { padding: 20px; }
            .work-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 4rem; }
            footer { flex-direction: column; gap: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TYPESETTING<br>STUDIO</div>
        <nav>
            <ul>
                <li><a href="#">WORKS</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>TYPE<br>SETTING</h1>
    </section>

    <main class="work-grid">
        <div class="work-item">
            <img src="https://picsum.photos/1200/1500?random=10" alt="Work 01">
        </div>
        <div class="work-item">
            <img src="https://picsum.photos/1200/1500?random=11" alt="Work 02">
        </div>
        <div class="work-item">
            <img src="https://picsum.photos/1200/1500?random=12" alt="Work 03">
        </div>
        <div class="work-item">
            <img src="https://picsum.photos/1200/1500?random=13" alt="Work 04">
        </div>
    </main>

    <section class="work-info">
        <h2>WE CREATE<br>VISUAL IMPACT.</h2>
    </section>

    <footer>
        <div>
            <p>INSTAGRAM</p>
            <p>BEHANCE</p>
        </div>
        <div>
            <p>&copy; 2026 TYPESETTING STUDIO CLONE</p>
        </div>
    </footer>

</body>
</html>
