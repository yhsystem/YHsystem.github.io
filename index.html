<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LQVE — Absolute Final</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* 기본 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background-color: #fff; color: #000; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* 마우스 뒤에 생기는 선 (Canvas) */
        #trail-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; }
        /* 커스텀 마우스 포인터 */
        #cursor { position: fixed; width: 6px; height: 6px; background: #000; border-radius: 50%; pointer-events: none; z-index: 999; transform: translate(-50%, -50%); }

        header { position: fixed; top: 0; width: 100%; padding: 40px; display: flex; justify-content: space-between; z-index: 100; }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: 0.3em; }

        main { padding-top: 200px; padding-bottom: 100px; }

        /* 반응형 이미지 레이아웃 */
        .section-item { width: 100%; padding: 0 5%; margin-bottom: 20vh; display: flex; flex-direction: column; }
        .section-item:nth-child(even) { align-items: flex-end; }
        
        .img-mask { 
            width: 80%; max-width: 900px; height: 60vh; overflow: hidden; position: relative;
            background: #f0f0f0; /* 이미지 로딩 전 회색 박스 표시 */
        }
        
        /* [중요] 이미지 주소가 잘못되어도 박스는 보이게 설정 */
        .img-mask img { 
            width: 100%; height: 140%; object-fit: cover; position: absolute; top: -20%; 
            filter: grayscale(100%); transition: filter 0.8s;
        }
        .img-mask:hover img { filter: grayscale(0%); }

        .caption-wrap { margin-top: 20px; overflow: hidden; height: 15px; }
        .caption { font-size: 10px; letter-spacing: 0.15em; color: #888; transform: translateY(100%); }

        footer { padding: 100px; text-align: center; font-size: 9px; color: #ccc; border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <canvas id="trail-canvas"></canvas>
    <div id="cursor"></div>

    <header>
        <div class="logo">LQVE</div>
        <div style="font-size: 10px; letter-spacing: 0.1em;">INDEX / INFO</div>
    </header>

    <main>
        <div class="section-item">
            <div class="img-mask">
                <img src="https://picsum.photos/1200/1600?random=1" class="parallax">
            </div>
            <div class="caption-wrap"><p class="caption">01 — VISUAL ARCHIVE</p></div>
        </div>

        <div class="section-item">
            <div class="img-mask">
                <img src="https://picsum.photos/1200/1600?random=2" class="parallax">
            </div>
            <div class="caption-wrap"><p class="caption">02 — MINIMAL STRUCTURE</p></div>
        </div>
    </main>

    <footer>&copy; 2026 LQVE STUDIO.</footer>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // 1. 마우스 선 효과 (Canvas)
        const canvas = document.getElementById('trail-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        document.addEventListener('mousemove', (e) => {
            points.push({ x: e.clientX, y: e.clientY, age: 0 });
            gsap.to("#cursor", { x: e.clientX, y: e.clientY, duration: 0.1 });
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
                p.age++; if (p.age > 30) points.splice(i, 1);
            }
            ctx.stroke(); requestAnimationFrame(animate);
        }
        animate();

        // 2. 스크롤 애니메이션
        document.querySelectorAll(".section-item").forEach((item) => {
            const img = item.querySelector(".img-mask img");
            const cap = item.querySelector(".caption");

            // 이미지 패럴랙스
            gsap.to(img, {
                scrollTrigger: { trigger: item, scrub: 1.5 },
                y: "20%", ease: "none"
            });

            // 등장 애니메이션
            gsap.to(cap, {
                scrollTrigger: { trigger: item, start: "top 80%" },
                y: 0, duration: 1, ease: "power2.out"
            });
        });
    </script>
</body>
</html>
