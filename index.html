<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LQVE — Absolute Clone</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* 1. 스타일 초기화 및 기본 설정 */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            cursor: none; /* 커스텀 마우스 포인터 사용을 위해 기본 커서 숨김 */
        }

        body {
            background-color: #fff;
            color: #000;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            line-height: 1.2;
        }

        /* 2. 커스텀 마우스 포인터 (LQVE 스타일) */
        #cursor {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.1s ease;
        }

        /* 3. 헤더 (고정 레이아웃) */
        header {
            position: fixed; top: 0; width: 100%;
            padding: 45px 50px;
            display: flex; justify-content: space-between;
            z-index: 1000;
        }

        .logo {
            font-size: 22px; font-weight: 700; letter-spacing: 0.4em;
        }

        .nav-right {
            display: flex; gap: 50px;
            font-size: 10px; font-weight: 400; letter-spacing: 0.2em;
        }

        /* 4. 메인 콘텐츠 (비대칭 여백 및 이미지 그리드) */
        main {
            padding-top: 300px;
            padding-bottom: 200px;
        }

        .section-item {
            width: 100%;
            padding: 0 8%;
            margin-bottom: 35vh; /* 원본의 깊은 여백 */
            display: flex;
            flex-direction: column;
        }

        /* 지그재그 배치 */
        .section-item:nth-child(even) { align-items: flex-end; }
        .section-item:nth-child(odd) { align-items: flex-start; }

        /* 이미지 컨테이너 (패럴랙스용) */
        .img-mask {
            width: 50vw; /* 이미지 가로 크기 */
            height: 65vh; /* 이미지 세로 크기 */
            overflow: hidden;
            position: relative;
            opacity: 0; /* 초기 숨김 */
            transform: translateY(80px);
        }

        .img-mask img {
            width: 100%;
            height: 140%; /* 이미지 내부 패럴랙스 여유분 */
            object-fit: cover;
            position: absolute;
            top: -20%; /* 초기 위치 */
            filter: grayscale(100%); /* 처음엔 흑백 */
            transition: filter 1s ease;
        }

        .img-mask:hover img {
            filter: grayscale(0%); /* 마우스 올리면 컬러 */
        }

        /* 글자 애니메이션 방식 (아래에서 위로 솟음) */
        .caption-wrap {
            margin-top: 25px;
            overflow: hidden; /* 글자가 올라오는 통로 */
        }

        .caption {
            font-size: 11px;
            letter-spacing: 0.15em;
            color: #777;
            text-transform: uppercase;
            transform: translateY(100%); /* 숨겨둠 */
        }

        /* 5. 푸터 */
        footer {
            padding: 150px 50px;
            text-align: center;
            font-size: 9px;
            letter-spacing: 0.3em;
            color: #bbb;
            border-top: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <header>
        <div class="logo">LQVE</div>
        <div class="nav-right">
            <span>COLLECTION</span>
            <span>INFORMATION</span>
        </div>
    </header>

    <main>
        <div class="section-item">
            <div class="img-mask reveal">
                <img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=1500&q=80" class="parallax">
            </div>
            <div class="caption-wrap">
                <p class="caption">01 — ESSENTIAL FLOW</p>
            </div>
        </div>

        <div class="section-item">
            <div class="img-mask reveal">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1500&q=80" class="parallax">
            </div>
            <div class="caption-wrap">
                <p class="caption">02 — SILENCE OF SPACE</p>
            </div>
        </div>

        <div class="section-item">
            <div class="img-mask reveal">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1500&q=80" class="parallax">
            </div>
            <div class="caption-wrap">
                <p class="caption">03 — STRUCTURE 2026</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 LQVE STUDIO. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // 1. 마우스 포인터 로직 (똑같이 따라오기)
        const cursor = document.querySelector('#cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, {
                x: e.clientX,
                y: e.clientY,
                duration: 0.2,
                ease: "power2.out"
            });
        });

        // 2. [핵심] 스크롤 시 이미지 내부가 움직이는 패럴랙스
        const parallaxImages = document.querySelectorAll(".parallax");
        parallaxImages.forEach((img) => {
            gsap.to(img, {
                scrollTrigger: {
                    trigger: img.parentElement,
                    start: "top bottom",
                    end: "bottom top",
                    scrub: 1.5 // 끈적하게 따라오는 정도 조절
                },
                y: "25%", // 이미지 내부 이동 범위
                ease: "none"
            });
        });

        // 3. [핵심] 스크롤 시 이미지 상자 & 글자 애니메이션
        const revealBoxes = document.querySelectorAll(".section-item");
        revealBoxes.forEach((item) => {
            const img = item.querySelector(".img-mask");
            const txt = item.querySelector(".caption");

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: item,
                    start: "top 85%", // 화면 하단에 보이기 시작할 때
                    toggleActions: "play none none reverse"
                }
            });

            tl.to(img, {
                opacity: 1,
                y: 0,
                duration: 1.8,
                ease: "power4.out"
            })
            .to(txt, {
                y: 0,
                duration: 1.2,
                ease: "power3.out"
            }, "-=1.2"); // 이미지 올라올 때 글자도 같이 등장
        });

        // 마우스 호버 시 포인터 확대 효과
        document.querySelectorAll('.img-mask').forEach(box => {
            box.addEventListener('mouseenter', () => gsap.to(cursor, { scale: 6, alpha: 0.2 }));
            box.addEventListener('mouseleave', () => gsap.to(cursor, { scale: 1, alpha: 1 }));
        });
    </script>
</body>
</html>
