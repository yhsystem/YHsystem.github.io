<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S5-STYLE CLONE</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* 1. 기본 스타일: 원본의 블랙 테마와 숨겨진 커서 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* 기본 마우스 숨김 */
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
        }

        /* 2. 커스텀 마우스 포인터: 원본처럼 글자 위에서 반전됨 */
        #cursor {
            position: fixed;
            width: 15px;
            height: 15px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference; /* 글자 위에서 색상 반전 */
            transition: transform 0.2s ease-out;
        }

        /* 3. 인트로 로딩 애니메이션: 화면이 열릴 때 나타나는 효과 */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .loader-text {
            font-size: 2rem;
            letter-spacing: 10px;
            overflow: hidden;
        }

        /* 4. 메인 비주얼 영역 */
        header {
            height: 100vh;
            display: flex;
            align-items: center;
            padding-left: 10%;
        }

        .main-title {
            font-size: clamp(4rem, 12vw, 10rem);
            line-height: 0.9;
            text-transform: uppercase;
        }

        .main-title span {
            display: block;
            overflow: hidden;
        }

        .main-title i {
            display: block;
            font-style: normal;
            transform: translateY(100%); /* 처음엔 숨겨둠 */
        }

        /* 5. 콘텐츠 그리드: 스크롤 시 페이드인/아웃 */
        .section {
            padding: 100px 10%;
            min-height: 100vh;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px;
        }

        .work-item {
            position: relative;
            opacity: 0;
            transform: translateY(50px);
        }

        .img-wrap {
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #222;
        }

        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .work-item:hover img {
            transform: scale(1.1);
        }

        .work-item h3 {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 2px;
            color: #888;
        }

        /* 6. 푸터 */
        footer {
            padding: 100px 10%;
            border-top: 1px solid #222;
            text-align: center;
            font-size: 12px;
            color: #444;
        }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <div id="loader">
        <div class="loader-text">S5-STYLE</div>
    </div>

    <header>
        <h1 class="main-title">
            <span><i>CREATIVE</i></span>
            <span><i>STRATEGY</i></span>
            <span><i>DESIGN</i></span>
        </h1>
    </header>

    <section class="section">
        <div class="grid">
            <div class="work-item">
                <div class="img-wrap"><img src="https://picsum.photos/1200/800?random=1"></div>
                <h3>PROJECT 01 / ARCHIVE</h3>
            </div>
            <div class="work-item">
                <div class="img-wrap"><img src="https://picsum.photos/1200/800?random=2"></div>
                <h3>PROJECT 02 / BRANDING</h3>
            </div>
            <div class="work-item">
                <div class="img-wrap"><img src="https://picsum.photos/1200/800?random=3"></div>
                <h3>PROJECT 03 / DIGITAL</h3>
            </div>
            <div class="work-item">
                <div class="img-wrap"><img src="https://picsum.photos/1200/800?random=4"></div>
                <h3>PROJECT 04 / VISION</h3>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 S5-STYLE CLONE. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        // 1. 마우스 포인터 로직 (똑같이 따라오게)
        const cursor = document.querySelector('#cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, {
                x: e.clientX,
                y: e.clientY,
                duration: 0.15,
                ease: "power2.out"
            });
        });

        // 2. 인트로 로딩 및 타이틀 애니메이션 (순차적 등장)
        window.addEventListener('load', () => {
            const tl = gsap.timeline();
            
            tl.to("#loader", {
                opacity: 0,
                duration: 1,
                delay: 1.5,
                onComplete: () => document.querySelector("#loader").style.display = "none"
            })
            .to(".main-title i", {
                y: 0,
                duration: 1.2,
                stagger: 0.2, // 글자가 하나씩 순차적으로 올라옴
                ease: "power4.out"
            }, "-=0.5");
        });

        // 3. 스크롤 애니메이션 (스크롤할 때 페이드인)
        gsap.registerPlugin(ScrollTrigger);

        gsap.utils.toArray(".work-item").forEach((item) => {
            gsap.to(item, {
                scrollTrigger: {
                    trigger: item,
                    start: "top 85%",
                    toggleActions: "play none none reverse"
                },
                opacity: 1,
                y: 0,
                duration: 1.2,
                ease: "power3.out"
            });
        });

        // 마우스 호버 시 포인터 확대 효과
        document.querySelectorAll('.work-item').forEach(item => {
            item.addEventListener('mouseenter', () => gsap.to(cursor, { scale: 4, alpha: 0.3 }));
            item.addEventListener('mouseleave', () => gsap.to(cursor, { scale: 1, alpha: 1 }));
        });
    </script>
</body>
</html>
