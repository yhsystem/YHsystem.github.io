<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LQVE Style — Perfect Clone</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>

    <style>
        /* [1. 기본 스타일] 원본 특유의 블랙/화이트 테마 및 미니멀리즘 */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            cursor: none; /* 기본 마우스 숨김 */
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Inter', sans-serif;
            line-height: 1.2;
            overflow-x: hidden; /* 가로 스크롤 방지 */
        }

        /* [2. 커스텀 커서] LQVE 스타일의 작은 점 포인터 */
        #cursor {
            position: fixed; width: 6px; height: 6px;
            background: #ff0000; /* 포인트 색상 */
            border-radius: 50%;
            pointer-events: none; z-index: 10000;
            transform: translate(-50%, -50%);
        }

        /* [3. 로딩 화면] 인트로 애니메이션 */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 20000;
            display: flex; justify-content: center; align-items: center;
        }
        .loader-logo { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.3em; opacity: 0; }

        /* [4. 헤더] 상단 로고 및 메뉴 */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 40px 50px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }
        .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.4em; }
        .nav-links { display: flex; gap: 40px; font-size: 11px; letter-spacing: 0.2em; font-weight: 400; }

        /* [5. 메인 레이아웃] 지그재그 이미지 배치 (핵심) */
        main {
            padding-top: 250px; /* 헤더 공간 */
        }

        .section-item {
            width: 100%;
            padding: 0 5%;
            margin-bottom: 30vh; /* 이미지 사이의 거대한 여백 */
            display: flex;
            flex-direction: column;
        }

        /* 홀수/짝수 이미지를 왼쪽/오른쪽으로 어긋나게 배치 */
        .section-item:nth-child(odd) { align-items: flex-start; }
        .section-item:nth-child(even) { align-items: flex-end; }

        /* 이미지 컨테이너 (패럴랙스 마스크) */
        .img-mask {
            width: 55%; /* 이미지 너비 */
            max-width: 900px;
            height: 70vh; /* 이미지 높이 비율 */
            overflow: hidden;
            position: relative;
            opacity: 0; transform: translateY(100px); /* 애니메이션 초기값 */
        }

        .img-mask img {
            width: 100%;
            height: 140%; /* 내부 패럴랙스 여유분 (위아래로 움직임) */
            object-fit: cover;
            position: absolute;
            top: -20%; /* 초기 위치 */
            filter: grayscale(100%); /* 흑백 효과 */
            transition: filter 1s ease;
        }

        .img-mask:hover img {
            filter: grayscale(0%); /* 마우스 올리면 컬러로 */
        }

        /* 글자 애니메이션 (아래에서 위로 솟음) */
        .caption-wrap { margin-top: 25px; overflow: hidden; height: 1.2em; }
        .caption { font-size: 10px; letter-spacing: 0.15em; color: #888; text-transform: uppercase; transform: translateY(100%); }

        /* 6. 푸터 */
        footer {
            padding: 100px 50px; border-top: 1px solid #eee; text-align: center;
            font-size: 9px; color: #aaa; letter-spacing: 0.2em;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-logo">LQVE.JP</div>
    </div>

    <div id="cursor"></div>

    <header>
        <div class="logo">LQVE</div>
        <div class="nav-links">
            <span>INDEX</span>
            <span>INFORMATION</span>
        </div>
    </header>

    <main id="smooth-content">
        <div class="section-item">
            <div class="img-mask reveal-item">
                <img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?q=80&w=2000" alt="Work 01" class="parallax-img">
            </div>
            <div class="caption-wrap">
                <p class="caption">01 — ESSENTIAL DESIGN / ARCHIVE</p>
            </div>
        </div>

        <div class="section-item">
            <div class="img-mask reveal-item">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000" alt="Work 02" class="parallax-img">
            </div>
            <div class="caption-wrap">
                <p class="caption">02 — STRUCTURED LIGHT / SEOUL</p>
            </div>
        </div>

        <div class="section-item">
            <div class="img-mask reveal-item">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2000" alt="Work 03" class="parallax-img">
            </div>
            <div class="caption-wrap">
                <p class="caption">03 — MONOCHROME FLOW / LONDON</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 LQVE STUDIO. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // 1. [수정] 마우스 포인터 로직 (똑같이 따라오게)
        const cursorDot = document.querySelector('#cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursorDot, { x: e.clientX, y: e.clientY, duration: 0.1 });
        });

        // 마우스 호버 시 커서 확대 효과 (선택사항)
        document.querySelectorAll('.reveal-item').forEach(item => {
            item.addEventListener('mouseenter', () => gsap.to(cursorDot, { scale: 3, alpha: 0.3 }));
            item.addEventListener('mouseleave', () => gsap.to(cursorDot, { scale: 1, alpha: 1 }));
        });

        // 2. [핵심] 스무스 스크롤 (Lenis 라이브러리)
        const lenis = new Lenis({
            duration: 1.5, // 원본의 묵직하고 부드러운 스크롤 느낌
            easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smooth: true
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // 3. [핵심] 스크롤 애니메이션 (Parallax & Reveal)
        // (1) 인트로 로딩 및 타이틀 등장
        window.addEventListener('load', () => {
            const tl = gsap.timeline();
            tl.to(".loader-logo", { opacity: 1, y: 0, duration: 1.2 })
              .to("#loader", {
                  opacity: 0,
                  duration: 1,
                  delay: 0.5,
                  onComplete: () => document.getElementById("loader").remove()
              });
        });

        // (2) 이미지 내부 패럴랙스 (이미지 안쪽이 움직임)
        const parallaxImgs = document.querySelectorAll(".parallax-img");
        parallaxImgs.forEach((img) => {
            gsap.to(img, {
                scrollTrigger: {
                    trigger: img.parentElement,
                    start: "top bottom", // 화면 하단에 보이기 시작할 때
                    end: "bottom top",    // 화면 상단으로 나갈 때
                    scrub: true,         // 스크롤에 맞춰 움직임
                },
                y: "20%", // 이미지 내부 이동 범위
                ease: "none"
            });
        });

        // (3) 이미지 상자 & 글자 애니메이션 (아래에서 위로)
        const revealBoxes = document.querySelectorAll(".section-item");
        revealBoxes.forEach((item) => {
            const mask = item.querySelector(".img-mask");
            const caption = item.querySelector(".caption");

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: item,
                    start: "top 85%", // 화면 하단에서 조금 올라오면 시작
                    toggleActions: "play none none reverse"
                }
            });

            tl.to(mask, { opacity: 1, y: 0, duration: 1.5, ease: "power4.out" })
              .to(caption, { y: 0, duration: 1.2, ease: "power3.out" }, "-=1.2"); // 이미지 올라올 때 글자도 같이 등장
        });
    </script>
</body>
</html>
