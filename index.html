<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S5-STYLE CLONE (Scroll Zoom)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* 1. 기본 스타일 (블랙 테마, 커서 숨김) */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            cursor: none; /* 커스텀 커서 사용 */
        }

        body {
            background-color: #000; color: #fff;
            font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
            overflow-x: hidden; /* 가로 스크롤 방지 */
        }

        /* 2. 커스텀 마우스 포인터 (글자 위 반전) */
        #cursor {
            position: fixed; width: 15px; height: 15px;
            background: #fff; border-radius: 50%;
            pointer-events: none; z-index: 9999;
            mix-blend-mode: difference; /* 색상 반전 */
            transition: transform 0.1s ease-out;
        }

        /* 3. 인트로 로딩 화면 */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; justify-content: center; align-items: center;
            z-index: 10000;
        }
        .loader-text { font-size: 1.5rem; letter-spacing: 8px; opacity: 0; }

        /* 4. [핵심] 스크롤 줌 섹션 설정 */
        .zoom-section {
            height: 100vh; /* 화면 가득 채움 */
            display: flex; justify-content: center; align-items: center;
            position: relative;
            overflow: hidden; /* 확대 시 글자가 화면 밖으로 나가는 것 방지 */
        }

        .main-title {
            font-size: clamp(5rem, 15vw, 15rem); /* 거대한 폰트 */
            line-height: 0.85; text-transform: uppercase;
            text-align: center;
            font-weight: 900;
            letter-spacing: -0.05em;
            
            /* 애니메이션 초기 상태 */
            transform: scale(1); /* 크기 정상 */
            opacity: 0; /* 처음에 안 보임 (인트로 애니메이션 후 나타남) */
        }

        .main-title span { display: block; }

        /* 5. 콘텐츠 그리드 섹션 */
        .content-section {
            padding: 100px 10%;
            background-color: #000; /* 줌 섹션 뒤에 배치 */
            position: relative; z-index: 10;
        }

        .grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 80px;
        }

        .work-item {
            position: relative;
            opacity: 0; transform: translateY(80px); /* 스크롤 전 상태 */
        }

        .img-wrap {
            width: 100%; aspect-ratio: 16 / 10; overflow: hidden; background: #222;
        }

        .img-wrap img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .work-item:hover img { transform: scale(1.08); }

        .work-item h3 { margin-top: 25px; font-size: 13px; letter-spacing: 2px; color: #aaa; }

        /* 푸터 */
        footer {
            padding: 100px 10%; border-top: 1px solid #222;
            text-align: center; font-size: 12px; color: #444;
        }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <div id="loader">
        <div class="loader-text">S5-STYLE</div>
    </div>

    <section class="zoom-section">
        <h1 class="main-title">
            <span>CREATIVE</span>
            <span>STRATEGY</span>
            <span>DESIGN</span>
        </h1>
    </section>

    <section class="content-section">
        <div class="grid">
            <div class="work-item">
                <div class="img-wrap"><img src="https://picsum.photos/1200/800?random=1"></div>
                <h3>PROJECT 01 / ARCHIVE</h3>
            </div>
            <div class="work-item">
                <div class="img-wrap"><img src="https://picsum.photos/1200/800?random=2"></div>
                <h3>PROJECT 02 / BRANDING</h3>
            </div>
            <div class="work-item">
                <div class="img-wrap"><img src="https://picsum.photos/1200/800?random=3"></div>
                <h3>PROJECT 03 / DIGITAL</h3>
            </div>
            <div class="work-item">
                <div class="img-wrap"><img src="https://picsum.photos/1200/800?random=4"></div>
                <h3>PROJECT 04 / VISION</h3>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 S5-STYLE CLONE. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        // 1. 마우스 포인터 움직임 (똑같이 따라오게)
        const cursor = document.querySelector('#cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
        });

        // 2. 인트로 로딩 애니메이션
        window.addEventListener('load', () => {
            const tl = gsap.timeline();
            
            tl.to(".loader-text", { opacity: 1, duration: 1 })
              .to("#loader", {
                  opacity: 0,
                  duration: 1,
                  delay: 0.5,
                  onComplete: () => document.querySelector("#loader").style.display = "none"
              })
              // 로딩 후 메인 타이틀 서서히 등장
              .to(".main-title", { opacity: 1, duration: 1 }, "-=0.5");
        });

        // 3. 스크롤 애니메이션 활성화
        gsap.registerPlugin(ScrollTrigger);

        // [핵심] 스크롤 시 메인 타이틀 확대 및 페이드아웃 (scrub 효과)
        gsap.to(".main-title", {
            scrollTrigger: {
                trigger: ".zoom-section", // 애니메이션 시작점
                start: "top top",         // 섹션 탑이 화면 탑에 닿을 때
                end: "+=100%",            // 화면 높이만큼 스크롤할 동안
                scrub: 1,                 // 스크롤 속도에 맞춰 애니메이션 진행 (중요)
                pin: true,                // 애니메이션 동안 화면 고정 (중요)
                anticipatePin: 1
            },
            scale: 3,        // 3배 확대
            opacity: 0,      // 서서히 투명하게
            ease: "power2.inOut"
        });

        // 4. 콘텐츠 그리드 스크롤 페이드인
        gsap.utils.toArray(".work-item").forEach((item) => {
            gsap.to(item, {
                scrollTrigger: {
                    trigger: item,
                    start: "top 85%",
                    toggleActions: "play none none reverse"
                },
                opacity: 1,
                y: 0,
                duration: 1.2,
                ease: "power3.out"
            });
        });
    </script>
</body>
</html>
